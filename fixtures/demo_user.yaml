# Demo fixture for the API, not a real student and not published limits. Source: this file.
user_id: student_001
mandate:
  id: mandate-student_001-v1
  currency: SGD
  per_txn_limit: "1500"
  daily_limit: "2500"
  # self_sg is the student's own Singapore account, the payee of a rescue's emergency allowance.
  allowed_payees: [landlord_sp, self_sg]
  allowed_corridors: [SG>BR, SG>SG]
  allowed_purposes: [rent, emergency]
  cooling_hours: 24
  # Fixture: self_sg was added long before any demo, so it is never inside its cooling period.
  payee_added_at:
    self_sg: "2026-01-01T00:00:00Z"
# The mandate is valid from the moment the API starts for this many days.
valid_days: 365
balances:
  SGD: "2300"
  BRL: "150"
# Fixture: the payees who have a Pix key on file, by payee id. The key itself is never held here.
pix_key_on_file: [landlord_sp]
# Fixture: the documents held for a remittance from China, named as cn_boc_anxin_009 names them.
documents_on_file: [passport, ID card or Hukou book, enrollment or admission letter]
# Fixture: whether the parents' position against China's annual foreign currency quota is known.
quota_position_known: true
# Fixture: the student's Chinese bank cards and the yuan withdrawn overseas on each, so far this
# calendar year and so far today. Not real cards or withdrawals. Source: this file. The first card is
# close to the annual cap of cn_atm_cap_005, which counts every card together: 94,500 of it is used.
chinese_cards:
  - instrument_id: "icbc:card_03"
    withdrawn_this_year: "88000"
    withdrawn_today: "0"
  - instrument_id: "boc:card_04"
    withdrawn_this_year: "6500"
    withdrawn_today: "1500"
# Fixture: a parent's transfer from China that has not arrived, which the student can trace.
# The rail moves it through its stages by its own simulated clock. Not a real transfer.
inbound_receipts:
  cn_bank_remit_sim:
    - receipt_id: cn_bank_remit_sim-in-0001
      amount: "20000"
      currency: CNY
      corridor: "CN>SG"
      status: created
      sender: parent
      sent_hours_ago: 100
# Scripted traces per rail, so a trace of the first Wise receipt has an answer.
# The rail stamps stage_entered_at from its own receipt, so the fixture gives no time.
traces:
  wise:
    - receipt_id: wise-0001
      status: in_transit
      typical_duration_hours: 24
      typical_duration_source: fixture
      next_steps: [Wait for the recipient bank to credit the payment.]
      warnings: []
# The student's resilience plan, which a rescue reads. Every value is a fixture: not a real card,
# contact, answer, or published figure. Source: this file.
plan:
  cards:
    - name: Wise debit card
      instrument_id: "wise:card_01"
    - name: Revolut card
      instrument_id: "revolut:card_02"
  primary_instrument: "wise:card_01"
  backup_instrument: "revolut:card_02"
  backup_route: wise
  wallet_token_present: true
  # A name and a channel only. Lifeline never holds the contact's phone number or email.
  trusted_contact:
    name: Ana
    channel: whatsapp
  cash_plan: [sg_cash_pickup_001]
  # Issuer to the knowledge entry holding its replacement card delivery estimate.
  replacement_estimates:
    wise: sg_card_replacement_002
  # Fixture: 300 SGD, inside the per transaction limit of 1500 and the daily limit of 2500 above.
  emergency_allowance: "300"
  emergency_payee: self_sg
  emergency_corridor: "SG>SG"
  emergency_purpose: emergency
  family_notice_opt_in: true
  identity_check:
    question: What are the last four characters of your student pass number?
    # Fixture: the answer the student set before departure. Never written to the ledger or a reply.
    expected_answer: "7Q2K"
