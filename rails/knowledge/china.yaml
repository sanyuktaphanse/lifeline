- id: cn_wise_out_008
  statement: "Wise lets a customer send money from CNY if they are not mainland Chinese, which includes people from Taiwan, Hong Kong or Macau, are working or have worked in China, and have a valid tax record from the China tax authority showing taxes paid within the last 3 years. One transfer can send at most 300,000 yuan from a China bank app or 50,000 yuan from Alipay, and an overall limit, in general the salary earned in China after deducting the tax paid there, caps the total."
  country: CN
  rail: wise
