    consequence: "Exceeding the annual cap bars overseas withdrawals for the rest of that year and the following year."
  note: "Claude Code opened the page on 9 October 2026, dispatched on 30 December 2017. It is SAFE's English translation, where the original Chinese prevails, and it says the current and second years, which the statement reads as the rest of that year and the following year."
- id: cn_wallet_foreign_006
  statement: "On 1 March 2024 a deputy governor of the People's Bank of China told a press briefing that the central bank will instruct platforms such as Alipay and Tenpay to raise the limits for overseas travellers using mobile payments: the single transaction limit from 1,000 US dollars to 5,000 US dollars, and the annual cumulative transaction limit from 10,000 US dollars to 50,000 US dollars."
  country: CN
  rail: wallet
