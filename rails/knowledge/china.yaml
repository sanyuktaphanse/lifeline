- id: cn_fx_quota_001
  statement: "Individuals in China have an annual facilitation quota of 50,000 US dollars for buying foreign currency. Study abroad fees are a permitted purpose. The quota was confirmed unchanged in January 2026 reporting."
  country: CN
  rail: bank_fx
  kind: quota
  source_url: "https://www.webull.com/news/13974173100655616"
  source_type: press
  date_checked: 2026-09-15
  checked_by: "S"
  second_check_by: ""
  used_by: [T36, X28]
- id: cn_edu_remit_002
  statement: "Tuition and living costs above the quota can be remitted with documents without consuming the quota. The payment goes to the institution's account, the daily cap is 50,000 US dollars equivalent, and more than two weeks should be allowed."
  country: CN
  rail: bank_remittance
  kind: rule
  source_url: "https://www.hsbc.com.cn/en-cn/international/products/education-payment/"
  source_type: bank
  date_checked: 2026-09-15
  checked_by: "S"
  second_check_by: ""
  used_by: [T36, T31]
- id: cn_edu_docs_003
  statement: "The documents required are the admission letter or student card, the student's resident ID, the passport and visa for the destination, relationship proof such as the household registration or birth certificate, and payment proof matching the amount. Originals or scans of originals are accepted."
  country: CN
  rail: bank_remittance
  kind: documents
  source_url: "https://www.hsbc.com.cn/en-cn/international/products/education-payment/"
  source_type: bank
  date_checked: 2026-09-15
  checked_by: "S"
