- id: cn_wise_in_007
  statement: "Wise sends CNY into China to Alipay, WeChat, and UnionPay for recipients with a Chinese national ID, up to 50,000 yuan per transfer to Alipay and 33,000 yuan per transfer to UnionPay."
  country: CN
  rail: wise
  kind: limit
  source_url: "https://wise.com/help/articles/2955298/guide-to-cny-transfers"
