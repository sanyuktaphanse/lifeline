- id: cn_boc_anxin_009
  statement: "Bank of China's page on the An Xin account, from 2010, says it is an SGD savings account at Bank of China Singapore Branch for applicants who hold a valid passport and an admission letter from a university or college in Singapore and are 14 years old or above. It is applied for at the Beijing, Shanghai, Guangdong, Shenzhen, Jiangsu, Zhejiang, Shandong, Liaoning, Shenyang, Fujian or Tianjin branch of Bank of China or their designated sub branches, with the originals of the passport, the ID card or Hukou book, and the enrollment or admission letter. Once the application is approved, money can be remitted to it with the customer reference number the Singapore Branch provides, and the student then activates the account in person at the Singapore Branch with the passport and student's pass."
  country: CN
  rail: bank_remittance
  kind: documents
  source_url: "https://www.boc.cn/en/pbservice/pb4/201005/t20100520_1323963.html"
  source_type: bank
