- id: cn_fx_quota_001
  statement: "SAFE's Detailed Rules on Measures for the Administration of Individual Foreign Exchange, explained by SAFE's spokesman on 5 January 2007, set an annual quota of 50,000 US dollars for foreign exchange purchases by domestic individuals, raised from 20,000 US dollars, and an annual quota of 50,000 US dollars for foreign exchange sales by individuals. Formalities for purchases and sales within the quota are simplified, and the authenticity of transactions exceeding the quota is examined more closely."
  country: CN
  rail: bank_fx
  kind: quota
  source_url: "https://www.safe.gov.cn/en/2007/0105/819.html"
  source_type: regulator
  date_checked: 2026-10-09
  checked_by: "CC"
  second_check_by: ""
  used_by: [T36, X28]
  note: "Claude Code opened SAFE's page on 9 October 2026, dispatched on 5 January 2007: the spokesman's press conference on the Detailed Rules. The entry moved from a news aggregator's report of 5 December 2025. The page is from 2007 and does not itself show the quota is unchanged today."
- id: cn_edu_remit_002
  statement: "HSBC China's International Education Payment System is for HSBC Premier, Premier Elite, Global Private Banking and Advance customers, and covers more than 1,000 educational institutes in the US, UK, Canada, Australia and Hong Kong SAR. Through it, a foreign currency purchase for an overseas education remittance need not use the SAFE annual facilitation quota when the application includes documents that meet regulatory and HSBC's requirements, such as payment proof for tuition fees and living expenses. Accumulative daily limits equivalent to 50,000 US dollars apply to the relevant transactions, and HSBC strongly recommends allowing more than 2 weeks to process remittances."
  country: CN
  rail: bank_remittance
  kind: rule
  source_url: "https://www.hsbc.com.cn/en-cn/international/products/education-payment/"
  source_type: bank
  date_checked: 2026-10-09
  checked_by: "CC"
  second_check_by: ""
  used_by: [T36, T31, X28]
  note: "Claude Code opened the page on 9 October 2026. The page carries no date. The two weeks advice sits in collapsed FAQ sections. Singapore is not among the places the page names, so the rails that cite this entry say no sourced Singapore page is on file."
- id: cn_edu_docs_003
  statement: "For HSBC China's education payments, the documents for review are payment proof whose transaction amount and details match the institution, the academic term, the foreign exchange purchase and the remittance amount; the admission letter or student ID; the student's resident ID; the passport and visa; and relationship certificates, which are a birth certificate or the household registration booklet. They are uploaded through HSBC's mobile banking as photos or scans of the original documents. Photos or scans of copies are not accepted, and HSBC does not accept documents by email or other channels."
  country: CN
  rail: bank_remittance
  kind: documents
  source_url: "https://www.hsbc.com.cn/en-cn/international/products/education-payment/"
  source_type: bank
  date_checked: 2026-10-09
  checked_by: "CC"
  second_check_by: ""
  used_by: [T36, precheck.remit_from_china]
  note: "Claude Code opened the page on 9 October 2026. The page carries no date and says HSBC may adjust the document list from time to time."
- id: cn_cdd_004
  statement: "From 1 January 2026, under the Administrative Measures on Customer Due Diligence and Retention of Customer Identification Data and Transaction Records of Financial Institutions, issued jointly by the People's Bank of China, the National Financial Regulatory Administration and the China Securities Regulatory Commission, a financial institution or money transfer business sending a customer's funds abroad must verify the accuracy of the remitter's information when a single remittance is 5,000 yuan or more, or 1,000 US dollars or more in foreign currency."
  country: CN
  rail: all
  kind: rule
  source_url: "https://www.pbc.gov.cn/tiaofasi/144941/144957/5916164/index.html"
  source_type: regulator
  date_checked: 2026-10-09
  checked_by: "CC"
  second_check_by: ""
  used_by: [X28, T36]
  note: "Claude Code opened the People's Bank page on 9 October 2026. It holds the Chinese text of Order 2025 No. 11, published on 28 November 2025; the statement translates Article 34 and Article 52. The order says nothing about splitting a transfer across people, so Lifeline's refusal of a plan that uses several people's quotas is its own policy, recorded in docs/decisions.md on 9 October 2026."
- id: cn_atm_cap_005
  statement: "Overseas cash withdrawals on all of an individual's Chinese bank cards, including supplementary cards, are capped at 100,000 yuan per calendar year and 10,000 yuan per card per day. Exceeding the annual cap bars overseas withdrawals for the rest of that year and the following year. The rule took effect on 1 January 2018."
  country: CN
  rail: card
  kind: limit
  source_url: "https://www.safe.gov.cn/en/2017/1230/1397.html"
  source_type: regulator
  date_checked: 2026-10-09
  checked_by: "CC"
  second_check_by: ""
