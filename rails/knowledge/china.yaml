- id: cn_cdd_004
  statement: "From 1 January 2026, cross border remittances of 5,000 yuan or 1,000 US dollars or more per transaction require customer identity verification under the joint due diligence measures of the People's Bank, the financial regulator, and the securities regulator. Splitting a transfer across people is structuring."
  country: CN
  rail: all
  kind: rule
  source_url: "https://www.webull.com/news/13974173100655616"
  source_type: press
  date_checked: 2026-09-15
  checked_by: "S"
  second_check_by: ""
  used_by: [X28, T36]
  note: "Verify against the PBOC text."
- id: cn_atm_cap_005
  statement: "Overseas cash withdrawals on all of an individual's Chinese bank cards, including supplementary cards, are capped at 100,000 yuan per calendar year and 10,000 yuan per card per day. Exceeding the annual cap bars overseas withdrawals for the rest of that year and the following year. The rule took effect on 1 January 2018."
  country: CN
  rail: card
  kind: limit
  source_url: "https://www.safe.gov.cn/en/2017/1230/1397.html"
  source_type: regulator
  date_checked: 2026-09-15
  checked_by: "S"
  second_check_by: ""
  used_by: [T37]
- id: cn_wallet_foreign_006
  statement: "Foreign bank cards linked to Alipay and WeChat Pay have a single transaction limit of 5,000 US dollars and an annual limit of 50,000 US dollars, raised from 1,000 and 10,000 US dollars. The People's Bank announced the change on 1 March 2024."
  country: CN
  rail: wallet
  kind: limit
  source_url: "https://english.www.gov.cn/news/202403/01/content_WS65e1dacdc6d0868f4e8e487b.html"
