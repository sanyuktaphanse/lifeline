  checked_by: "CC"
  second_check_by: ""
  used_by: [T31, T36, cn_bank_remit_sim, precheck.remit_from_china]
  values:
    documents: [passport, ID card or Hukou book, enrollment or admission letter]
  note: "Claude Code opened the page on 9 October 2026. The page shows no date of its own; its address and its promotion running to 31 December 2010 date it to 2010. It gives no time for a remittance to arrive. Check with Bank of China that the service is still offered."
