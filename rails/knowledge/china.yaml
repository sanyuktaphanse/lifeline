- id: cn_wise_in_007
  statement: "Wise sends CNY into China to UnionPay, Alipay and Weixin, up to 33,000 yuan per transaction to UnionPay and 50,000 yuan per transfer to Alipay or to Weixin. For UnionPay, Wise supports both mainland and non mainland recipients, and the banks available depend on whether the recipient holds a Mainland Chinese National ID."
