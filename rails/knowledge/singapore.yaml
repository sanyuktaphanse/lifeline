- id: sg_nus_fee_payment_003
  statement: "NUS strongly recommends that international students pay through Flywire or Convera via NUS FastPay. A student, a family member or a third party can make a payment on the student's behalf through Convera GlobalPay; as part of KYC checks the payer must provide their details and authenticate the payment, and NUS may require the student to provide supporting documents about their relationship with the payer. A Convera payment is typically delivered to NUS within 2 to 3 business days after the offline transfer is completed. For e-wallet and international wire payments through Flywire, allow up to 1 to 2 business days to be reflected in EduRec."
  country: SG
  rail: all
  kind: rule
  source_url: "https://www.nus.edu.sg/finance/students/student-finance-matters/payments/other-payment-modes"
  source_type: operator
  date_checked: 2026-10-08
  checked_by: "SP"
  second_check_by: ""
  used_by: [T36, cn_bank_remit_sim]
  note: "SP opened the page in a browser on 8 October 2026 because the site's bot protection blocked the tool, and confirmed these sentences in its FAQ. The statement holds only those sentences. The page sits behind a bot challenge for tools, so a person must check it in a browser: expand the FAQ questions SP read on the live page on 8 October 2026: How long will it take for NUS to receive my Convera GlobalPay payment?, Can someone else pay using Convera Globalpay on my behalf? and How long does it take for a successful payment through Flywire to be reflected in EduRec."
