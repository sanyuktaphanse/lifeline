- id: in_upi_paynow_purpose_001
  statement: "Through the UPI-PayNow linkage between India and Singapore, only person to person remittances for the purposes of 'Maintenance of Relatives Abroad' and 'Gift' are allowed, under the Liberalised Remittance Scheme, whose limits apply."
  country: IN
  rail: upi_paynow
  kind: rule
  source_url: "https://www.rbi.org.in/commonman/english/scripts/FAQs.aspx?Id=3415"
