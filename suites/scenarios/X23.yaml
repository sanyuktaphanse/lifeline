  - lang: en
    turns:
      - user: "Send 1,200 SGD rent to landlord＿sp"
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: "landlord＿sp", purpose: rent}
