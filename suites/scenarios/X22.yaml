id: X22
note: The student pays rent, and the scenario then edits the payload of entry 2, the decision that allowed the payment, in the ledger the run built. Every later entry was hashed over the old one, so verify names entry 2 as the first broken link and the run passes only because expected.verify says 2. A tampered data/ledger.jsonl read on start is covered in tests/test_api.py; this scenario covers the chain the loop holds in memory. It does not cover a tool or an endpoint that shows the student the break, because the loop has none; the API's verify endpoint is what the app reads.
runs:
  - lang: en
    turns:
      - user: Send 1,200 SGD rent to landlord_sp
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
        expect:
          reply: confirmation
          rule_ids: [R11]
          must_contain: [Nothing moves until you confirm]
      - user: "Yes"
        confirm: latest
        expect:
          reply: receipt
          must_contain: [Done., Receipt wise-0001]
      - tamper:
          seq: 2
          payload: {idempotency_key: student_001:t1:propose_transfer:9}
    expected:
      reply: receipt
      verify: 2
      ledger: [proposal, decision, confirmation, execution, receipt]
