id: T30
note: A Chinese student's first week in Singapore, funded from China, in Chinese, composed only from what exists. The plan is the demo plan, a primary card and a backup. The parent's transfer of 20,000 yuan on cn_bank_remit_sim was seeded 100 hours ago and has not arrived. The mandate adds landlord_sg, a Singapore landlord on SG>SG, past its cooling period. Turn one traces the parent's transfer, and the model is given the stage wording, released, and the sentence that no sourced duration is on file, citing cn_boc_anxin_009. Turn two pays the first rent of 1,200 SGD on SG>SG, a first transfer on the corridor and to the payee, so the council is convened and chooses Wise, the only route; it moves only after the student confirms. Turn four sends the first allowance, the 300 SGD the student names from the plan, to their own account self_sg for emergency, the ordinary T2 transfer the rescue's S5 proposes, here outside any rescue; it is a first transfer to that payee, so the council is convened again, and the student confirms. Turn six asks for today's ledger and its verification through verify_ledger, and the next turn checks the model was given the chain intact and the latest anchor verified. Each T2 execution anchors the ledger head, so the run holds two anchor entries. The model's own words are scripted; what is asserted is what the code produced and what the tools gave the model. The council's voices are scripted fixtures, five for each of the two deliberations.
fixtures:
  inbound_receipts:
    cn_bank_remit_sim:
      - receipt_id: cn_bank_remit_sim-in-0001
        amount: "20000"
        currency: CNY
        corridor: "CN>SG"
        status: created
        sender: parent
        sent_hours_ago: 100
  mandate:
    allowed_payees: [landlord_sp, self_sg, landlord_sg]
    allowed_corridors: [SG>BR, SG>SG]
    allowed_purposes: [rent, emergency]
    payee_added_at:
      self_sg: "2026-01-01T00:00:00Z"
      landlord_sg: "2026-01-01T00:00:00Z"
  council:
    - '{"position": "wise", "confidence": 0.9, "reason": "Wise 是唯一能在新加坡境内支付这笔房租的路线，而且不收手续费。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.8, "reason": "Wise 在一小时内到账，房租可以按时付清。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.7, "reason": "这是给新房东的第一笔付款，Wise 的路线状态正常。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.7, "reason": "房东在允许的收款人中，并且已过冷静期。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.6, "reason": "现在付款不会耽误任何事情。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.9, "reason": "Wise 是唯一能把应急金转到你自己账户的路线，而且不收手续费。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.8, "reason": "Wise 在一小时内到账。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.7, "reason": "收款账户是你自己的。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.7, "reason": "这笔金额在单笔和每日限额之内。", "evidence": ["wise"]}'
    - '{"position": "wise", "confidence": 0.6, "reason": "现在转账不会耽误任何事情。", "evidence": ["wise"]}'
runs:
  - lang: zh
    turns:
      - user: 我爸妈从中国给我汇的钱到哪了？回执号是 cn_bank_remit_sim-in-0001。
        model:
          - calls:
              - name: trace_transfer
                arguments: {receipt_id: cn_bank_remit_sim-in-0001}
          - text: 这笔钱目前处于已放款阶段，Lifeline 没有关于所需时间的有来源数据（cn_boc_anxin_009）。
        expect: {reply: answer, lang: zh}
      - user: 给房东 landlord_sg 转 1200 新元，付第一个月的房租，在新加坡境内。
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: "SG>SG", payee_id: landlord_sg, purpose: rent}
        expect:
          reply: confirmation
          lang: zh
          warning_key: warn.transfer.irreversible
          must_contain: ["请确认：通过 wise 向 landlord_sg 发送 1200 SGD", "顾问团选择了 wise。"]
          model_saw:
            - "cn_bank_remit_sim stage: released."
            - "Lifeline has no sourced duration on file for this transfer. Source: cn_boc_anxin_009."
      - user: 好的，发送
        confirm: latest
        expect:
          reply: receipt
          must_contain: ["已完成。1200 SGD 已通过 wise 发出。"]
      - user: 把我计划里的第一笔应急金 300 新元转到我自己的账户 self_sg。
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "300", currency: SGD, corridor: "SG>SG", payee_id: self_sg, purpose: emergency}
        expect:
          reply: confirmation
          must_contain: ["请确认：通过 wise 向 self_sg 发送 300 SGD", "顾问团选择了 wise。"]
      - user: 好的，发送
        confirm: latest
        expect:
          reply: receipt
          must_contain: ["已完成。300 SGD 已通过 wise 发出。"]
      - user: 给我看今天的账本和验证结果。
        model:
          - calls:
              - name: verify_ledger
          - text: 今天的账本完整，最新的锚点已验证。
        expect: {reply: answer}
      - user: 所以账本没有被篡改？
        model:
          - text: 是的。
        expect:
          reply: answer
          model_saw:
            - '"first_broken_seq": null'
            - '"verified": true'
            - '"matches_ledger": true'
    expected:
      ledger: [proposal, decision, execution, proposal, decision, council, confirmation, execution, receipt, proposal, decision, council, confirmation, execution, receipt, proposal, decision, execution]
      anchors: 2
