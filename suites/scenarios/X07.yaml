id: X07
note: The loop recognises the replayed token as already used, rebuilds the action it paid, and hands it to the engine, which refuses it under R10 because that payment already executed, so the replay leaves a proposal and a decision. R11 is the rule for a token presented with a different action, which cannot happen through the loop and is tested in tests/test_mandate.py.
runs:
  - lang: en
    turns:
      - user: Send 1,200 SGD rent to landlord_sp
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
      - user: "Yes"
        confirm: latest
        expect: {reply: receipt}
      - user: Send 1,000 SGD rent to landlord_sp
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1000", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
        expect: {reply: confirmation}
      - user: Yes, use the confirmation I gave for the first payment
        confirm: 1
    expected:
      reply: refusal
      rule_ids: [R10]
      must_contain: [R10, was already executed]
      must_not_contain: [Done. 1000 SGD]
      ledger: [proposal, decision, confirmation, execution, receipt, proposal, decision, proposal, decision]
