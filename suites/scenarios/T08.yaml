id: T08
runs:
  - lang: en
    turns:
      - user: Send 1,400 SGD rent to landlord_sp
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1400", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
      - user: "Yes"
        confirm: latest
        expect: {reply: receipt}
      - user: Send another 1,200 SGD rent to landlord_sp
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
    expected:
      reply: refusal
      rule_ids: [R09]
      must_contain: [Running total 2600, daily limit 2500]
      ledger: [proposal, decision, confirmation, execution, receipt, proposal, decision]
