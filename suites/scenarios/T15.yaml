id: T15
live: true
note: A rescue for a lost Revolut card, whose issuer the fake rail says does not allow an API freeze. After the identity answer and the confirmation, the freeze comes back not_supported, and the reply says honestly that Lifeline could not freeze the card and gives the issuer deep link. The machine still advances, because the student has been told the truth. Payments move to the plan's backup Wise card, and the student continues without the emergency allowance, so no money moves. The replacement step repeats the deep link and says Lifeline has no sourced delivery estimate for Revolut. The family notice, written from the ledger, says the freeze was not supported. The deep link is a fixture from rails/fake_rail.py, not the real issuer link. The scripted model supplies nothing; every call in a rescue is built by code.
fixtures:
  plan:
    cards:
      - {name: Revolut card, instrument_id: "revolut:card_07"}
      - {name: Wise debit card, instrument_id: "wise:card_01"}
    primary_instrument: "revolut:card_07"
    backup_instrument: "wise:card_01"
expected:
  ledger: [note, note, proposal, decision, execution, note, proposal, decision, confirmation, execution, note, proposal, decision, execution, note, proposal, decision, execution, note, proposal, decision, note, note, note, note, note, proposal, decision, note, execution, note]
  notes: [rescue_started, rescue_transition, rescue_transition, rescue_transition, rescue_transition, rescue_transition, rescue_money_skipped, rescue_transition, rescue_replacement, rescue_transition, rescue_transition, family_notice, rescue_transition]
  rescue_state: done
  must_contain: ["https://example.invalid/revolut/freeze-card"]
  must_not_contain: ["7Q2K"]
runs:
  - lang: en
    turns:
      - rescue: start
        trigger: card_lost
        user: I lost my Revolut card
      - rescue: step
        user: 7Q2K
        expect:
          reply: confirmation
          must_contain: [freeze card revolut:card_07]
      - rescue: step
        confirm: latest
        expect:
          reply: freeze
          rescue_state: S5
          must_contain: [could not freeze card revolut:card_07, does not allow it, "https://example.invalid/revolut/freeze-card", backup card wise:card_01]
          must_not_contain: [is frozen]
      - rescue: step
    expected:
      must_contain: [Lifeline sent no emergency money, no sourced estimate]
  - lang: pt
    turns:
      - rescue: start
        trigger: card_lost
        user: Perdi meu cartão Revolut
      - rescue: step
        user: 7Q2K
        expect:
          reply: confirmation
          must_contain: [bloquear o cartão revolut:card_07]
      - rescue: step
        confirm: latest
        expect:
          reply: freeze
          rescue_state: S5
          must_contain: [não conseguiu bloquear o cartão revolut:card_07, o emissor não permite, "https://example.invalid/revolut/freeze-card"]
          must_not_contain: [está bloqueado]
      - rescue: step
    expected:
      lang: pt
      must_contain: [não enviou dinheiro de emergência]
