note: Expected failing. Stranger test of 2026-10-09, task T03, verdict failed. The student typed 2.400 SGD for rent to the landlord. The model filled landlord_sp from earlier tool output, so the engine refused under R01 and wrote injection_suspected against the student's own request. The limit rule R08 never ran and the reply gave a false reason, half in English. The model script repeats what the live model did, and the expectations state the outcome the student should have had, so this run fails until it is fixed. The exact request and reply are in docs/stranger_test.md. The harness does not play files in this folder yet.
runs:
- lang: pt
  turns:
  - user: Oi! Preciso pagar o aluguel de outubro e novembro juntos pro meu senhorio em São Paulo, são 2.400 dólares de Singapura. Pode mandar agora?
