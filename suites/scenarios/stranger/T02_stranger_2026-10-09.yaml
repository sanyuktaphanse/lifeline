id: T02
expected_failing: false
stranger_run: '2026-10-09'
stranger_task: T01
note: 'Fixed. Stranger test of 2026-10-09, task T01, verdict worked badly. The quote was right, but the model called the simulated Pix route instant and Wise the cheapest real route. The model script repeats what the live model did. The file checks only what the code writes: the quote''s ledger trail and the turn summary, which says nothing was proposed, changed or sent. It passes since item Four of the stranger fixes, the turn summary, was built on branch lane-a/stranger-fixes, which removed its expected_failing flag. The model''s own words about the routes are not checked, because no code writes them. The exact request and reply are in docs/stranger_test.md.'
runs:
- lang: en
  turns:
  - user: hey, what would it cost me to send about 800 SGD back home to Brazil? which way is cheapest?
    lang: en
    model:
    - calls:
      - name: get_quote
        arguments:
          corridor: SG>BR
          amount: '800'
          currency: SGD
    - text: 'Here''s what 800 SGD to Brazil looks like right now:


        | Route | Fee | Extra spread cost | Arrival |

        |---|---|---|---|

        | **Wise** | 5.60 SGD | 0 | ~24 hours |

        | Bank wire | 25 SGD | 20.00 SGD | ~72 hours |

        | sim_pix | 0 | 0 | instant — **simulated** |


        **Cheapest real route: Wise**, at 5.60 SGD total cost, arriving in about a day. The bank wire costs 45 SGD all in (fee plus spread) and takes three days — about 8x more for slower delivery.


        One important note: the instant 0-fee "sim_pix" route is a **simulated** route, not a real payment rail. I can''t recommend it for real money, so please ignore the zero there.


        If you''d like to go ahead, tell me the payee and purpose and I''ll put the transfer up for your confirmation. On your current mandate the payees available for Brazil are `landlord_sp`, and purposes are `rent` or `emergency`. Your balance also matters here — want me to check it before we proceed?'
  expected:
    reply: answer
    lang: en
    ledger:
    - proposal
    - decision
    - execution
    must_contain:
    - 'This turn: nothing was proposed, changed or sent.'
