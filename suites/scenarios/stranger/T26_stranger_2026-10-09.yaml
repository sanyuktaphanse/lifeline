id: T26
expected_failing: true
stranger_run: '2026-10-09'
stranger_task: T15
note: 'Expected failing. Stranger test of 2026-10-09, task T15, verdict failed. The student asked in their own words to cancel the last rent transfer. The model passed the receipt id, which the student''s own ledger holds but which earlier replies had also named, so the engine refused under R01 and wrote injection_suspected. The model script repeats what the live model did. The file checks only what the code writes: that the cancel of the student''s own receipt is offered for confirmation with warn.transfer.cancel and that no injection_suspected entry is written. It should pass once item One, the student''s own records is built. The exact request and reply are in docs/stranger_test.md.'
runs:
- lang: pt
  turns:
  - user: Pay 1,200 SGD rent to landlord_sp in Brazil
    lang: en
    model:
    - calls:
      - name: propose_transfer
        arguments:
          amount: '1200'
          currency: SGD
          corridor: SG>BR
          payee_id: landlord_sp
          purpose: rent
  - user: 'Yes'
    confirm: latest
    lang: en
  - user: nossa, que confusão. então cancela essa última transferência do aluguel, prefiro não arriscar pagar duas vezes
    lang: pt
    model:
    - calls:
      - name: cancel_transfer
        arguments:
          receipt_id: wise-0001
  expected:
    reply: confirmation
    warning_key: warn.transfer.cancel
    lang: pt
    ledger:
    - proposal
    - decision
    - confirmation
    - execution
    - receipt
    - proposal
    - decision
