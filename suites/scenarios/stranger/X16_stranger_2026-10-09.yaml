note: 'Expected failing. Stranger test of 2026-10-09, task T11, verdict worked badly. The model declined investment advice, then made claims with no source and leaned toward holding BRL. The model script repeats what the live model did. The file checks only what the code writes: that nothing is proposed and that the turn summary says so. It should pass once item Four, the turn summary is built. The model''s own words are not checked, because no code writes them. The exact request and reply are in docs/stranger_test.md.'
