id: T34
expected_failing: false
stranger_run: '2026-10-09'
stranger_task: T10
note: 'Fixed. Stranger test of 2026-10-09, task T10, verdict failed. The student typed the amount, the payee and the day. The model added a tolerance of 0 percent, 48 hours of notice and a 24 hour cancel window the student never gave, the engine traced the 0 to the earlier quote''s fees and refused under R01, and injection_suspected was written against the student''s own request. The model script repeats what the live model did. The file checks only what the code writes: that the standing mandate is offered for confirmation under R11 with warn.standing.new, with Lifeline''s default tolerance, notice and cancel window stated in the confirmation, and that no injection_suspected entry is written. It passes since item One of the stranger fixes, the student''s own records, was built on branch lane-a/stranger-fixes, which removed its expected_failing flag. The exact request and reply are in docs/stranger_test.md.'
runs:
- lang: pt
  turns:
  - user: hey, what would it cost me to send about 800 SGD back home to Brazil? which way is cheapest?
    lang: en
    model:
    - calls:
      - name: get_quote
        arguments:
          corridor: SG>BR
          amount: '800'
          currency: SGD
    - text: 'Here''s what 800 SGD to Brazil looks like right now:


        | Route | Fee | Extra spread cost | Arrival |

        |---|---|---|---|

        | **Wise** | 5.60 SGD | 0 | ~24 hours |

        | Bank wire | 25 SGD | 20.00 SGD | ~72 hours |

        | sim_pix | 0 | 0 | instant — **simulated** |


        **Cheapest real route: Wise**, at 5.60 SGD total cost, arriving in about a day. The bank wire costs 45 SGD all in (fee plus spread) and takes three days — about 8x more for slower delivery.


        One important note: the instant 0-fee "sim_pix" route is a **simulated** route, not a real payment rail. I can''t recommend it for real money, so please ignore the zero there.


        If you''d like to go ahead, tell me the payee and purpose and I''ll put the transfer up for your confirmation. On your current mandate the payees available for Brazil are `landlord_sp`, and purposes are `rent` or `emergency`. Your balance also matters here — want me to check it before we proceed?'
  - user: cansei de lembrar todo mês. dá pra deixar programado o aluguel? 1200 SGD pro landlord_sp todo dia 1, começando em novembro
    lang: pt
    model:
    - calls:
      - name: create_standing_mandate
        arguments:
          amount: '1200'
          currency: SGD
          corridor: SG>BR
          payee_id: landlord_sp
          purpose: rent
          schedule: monthly:1
          tolerance_pct: '0'
          notice_hours: '48'
          cancel_window_hours: '24'
  expected:
    reply: confirmation
    rule_ids:
    - R11
    warning_key: warn.standing.new
    lang: pt
    ledger:
    - proposal
    - decision
    - execution
    - proposal
    - decision
    must_contain:
    - com tolerância de 5 por cento
    - avisado 48 horas
    - durante 24 horas
