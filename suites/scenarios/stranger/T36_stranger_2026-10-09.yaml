    - text: '## 一、爸爸一个人的额度，不够


        个人年度购汇便利化额度是 **5 万美元**（SAFE《个人外汇管理办法实施细则》，2007 年 1 月 5 日新闻发言人答问；规则 `cn_fx_quota_001`）。您需要 **6 万美元**，差 1 万。


        超出部分银行会**更严格地审核交易真实性**——这是规则原文写的。


        ## 二、妈妈和舅舅各换一部分——我不帮您安排，但我要说实话


        **这不是法律禁止，是 Lifeline 自己的政策。** 系统明确告诉我：档案里**没有任何来源**说拆分到多人头上构成「分拆购汇」。所以我不能拿规则来吓唬您，那样是编的。


        我能说的是：我不协助用多个人的额度去凑同一个学生的费用。您完全可以自己去问银行柜台，他们的判断比我的政策更有分量。


        ## 三、更该走的路：留学购汇本来就可以不占便利化额度


        这才是重点。**凭真实材料办理留学购汇，可以不使用 5 万美元的便利化额度**——也就是说，6 万美元可以由爸爸一个人完成，根本不需要凑。


        需要的材料（规则 `cn_fx_quota_001`、`cn_cdd_004`）：

        - 护照

        - 身份证或户口本

        - **录取通知书 / 在读证明**

        - **学费与住宿费的缴费通知单（金额要对得上 6 万美元）**


        必须提醒一个缺口：我档案里这条路径的来源是**汇丰中国的留学付款页面**，它列的是美国、英国、加拿大、澳大利亚、香港的院校，**不含新加坡**，而我手上**没有新加坡的来源页**（`cn_edu_remit_002`）。所以这条路对新加坡是否同样适用，**请让爸爸直接问他的开户行**，别按我说的就去办。


        ## 四、还有两件实务


        - **2026 年 1 月 1 日起**，单笔汇出 ≥5,000 元人民币或 ≥1,000 美元，机构必须核验汇款人信息准确性（`cn_cdd_004`）。6 万美元必然触发，材料要齐。

        - **时间**：汇丰明确建议**预留 2 周以上**。今天是 10 月 9 日，如果下学期开学前要到账，现在就该准备材料。

        - 另一个思路：额度按**自然年**重置。爸爸今年换一部分、明年 1 月换一部分，用的是**同一个人**的两个年度额度——这条我没有政策障碍。前提是缴费截止日允许。


        另外，档案里那个中行「安心账户」页面是 **2010 年**的，只列了部分网点，是否还在办、在哪个网点办，**都要跟中行确认**（`cn_boc_anxin_009`）。


        ## 五、未了结的事


        - **wise-0002（1200 SGD）状态仍然不明**：账本显示 `completed`，余额却没扣，取消请求被规则 R01 挡下（那是误判，您确实是本人提的）。**请打开 Wise App 自己核对。** 要我 `trace_transfer` 查一下吗？

        - **房租定期扣款仍未建立。**


        在 wise-0002 弄清楚之前，**十月房租不要再付第二次**。 Lifeline 不会用其他人的额度来支付你的费用。以下内容为英文，翻译尚待完成：Refusing to use several people''s quotas for one student''s costs is Lifeline''s own policy, not a quoted rule: no source on file says that splitting a transfer across people is structuring. 尽职调查办法的规定：以下内容为英文原文，引自已记录的来源：From 1 January 2026, under the Administrative Measures on Customer Due Diligence and Retention of Customer Identification Data and Transaction Records of Financial Institutions, issued jointly by the People''s Bank of China, the National Financial Regulatory Administration and the China Securities Regulatory Commission, a financial institution or money transfer business sending a customer''s funds abroad must verify the accuracy of the remitter''s information when a single remittance is 5,000 yuan or more, or 1,000 US dollars or more in foreign currency. 超出额度的有据可查的途径：以下内容为英文原文，引自已记录的来源：SAFE''s Detailed Rules on Measures for the Administration of Individual Foreign Exchange, explained by SAFE''s
        spokesman on 5 January 2007, set an annual quota of 50,000 US dollars for foreign exchange purchases by domestic individuals, raised from 20,000 US dollars, and an annual quota of 50,000 US dollars for foreign exchange sales by individuals. Formalities for purchases and sales within the quota are simplified, and the authenticity of transactions exceeding the quota is examined more closely. HSBC China''s International Education Payment System is for HSBC Premier, Premier Elite, Global Private Banking and Advance customers, and covers more than 1,000 educational institutes in the US, UK, Canada, Australia and Hong Kong SAR. Through it, a foreign currency purchase for an overseas education remittance need not use the SAFE annual facilitation quota when the application includes documents that meet regulatory and HSBC''s requirements, such as payment proof for tuition fees and living expenses. Accumulative daily limits equivalent to 50,000 US dollars apply to the relevant transactions,
        and HSBC strongly recommends allowing more than 2 weeks to process remittances. 以下内容为英文，翻译尚待完成：The route above the quota rests on HSBC''s education payment page, which lists institutions in the US, UK, Canada, Australia and Hong Kong, not Singapore, and Lifeline has no sourced Singapore page on file for it. Source: cn_edu_remit_002. 来源：cn_cdd_004, cn_fx_quota_001, cn_edu_remit_002。'
