note: Expected failing. Stranger test of 2026-10-09, task T07, verdict failed. The parent's transfer was on file and traceable, but the model never called trace_transfer. It read the balance and a precheck and told the student the transfer could not be traced, then guessed at causes. The model script repeats what the live model did, and the expectations state the outcome the student should have had, so this run fails until it is fixed. The exact request and reply are in docs/stranger_test.md. The harness does not play files in this folder yet.
