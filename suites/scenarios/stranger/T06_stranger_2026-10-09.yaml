id: T06
expected_failing: true
stranger_run: '2026-10-09'
stranger_task: T13
note: 'Expected failing. Stranger test of 2026-10-09, task T13, verdict worked badly. Rent was proposed and paid on the student''s yes, but the confirmation opened with a council voice advising to wait, in the third person. The model script repeats what the live model did. The file checks only what the code writes: the confirmation and the receipt, and the turn summary of each call: the proposal waiting for confirmation, then the confirmed transfer with its receipt id. It should pass once item Four, the turn summary is built. The council''s wording is model text and is not reproduced, since this run has no council. The exact request and reply are in docs/stranger_test.md.'
runs:
- lang: pt
  turns:
  - user: 'Tá bom, então paga só o aluguel de outubro agora: 1200 SGD pro landlord_sp, finalidade aluguel.'
    lang: pt
    model:
    - calls:
      - name: propose_transfer
        arguments:
          amount: '1200'
          currency: SGD
          corridor: SG>BR
          payee_id: landlord_sp
          purpose: rent
    expect:
      reply: confirmation
      must_contain:
      - 'Neste turno: uma transferência de 1200 SGD para landlord_sp: proposta feita, aguardando sua confirmação.'
  - user: Sim
    confirm: latest
    lang: pt
  expected:
    reply: receipt
    lang: pt
    ledger:
    - proposal
    - decision
    - confirmation
    - execution
    - receipt
    must_contain:
    - 'Neste turno: uma transferência de 1200 SGD para landlord_sp: confirmação e execução, recibo wise-0001, estado completed.'
