id: T35
note: The student pays rent and then asks for this month's note. The scripted model calls monthly_summary, a T0 tool that runs as proposal, decision and execution, and the loop builds the note from the ledger alone, with no model, and adds it to the reply in the student's language. The amount, the corridor, the fee and the exchange cost in the note come from the run's own execution entry, whose sequence the execution payload names. No route carries a tax line, so the note says no tax figure is on file instead of a zero. In the English and Chinese runs the model quotes the corridor with get_quote in the same turn as the transfer, so the ledger holds the bank wire's quote for that transfer and the note gives the saving, 49.40 SGD, from the two entries; in the Portuguese run there is no quote, so the note says no comparison is on file. The unusual counts and what is coming next month are read from the same ledger, which holds neither here. The scheduler writes the same note once at the start of the next month, which unit tests and an API test check with an injected time; a scenario cannot set the month, so the tick is not part of it. The fees and the bank wire spread are the fake router's fixtures.
expected:
  reply: answer
  ledger: [proposal, decision, confirmation, execution, receipt, proposal, decision, execution]
runs:
  - lang: en
    expected:
      ledger: [proposal, decision, execution, proposal, decision, confirmation, execution, receipt, proposal, decision, execution]
    turns:
      - user: Send 1,200 SGD rent to landlord_sp in Brazil
        model:
          - calls:
              - name: get_quote
                arguments: {corridor: SG>BR, amount: "1200", currency: SGD, purpose: rent}
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
      - user: Yes, send it
        confirm: latest
      - user: Give me my note for this month
        model:
          - calls:
              - name: monthly_summary
          - text: ""
        expect:
          must_contain:
            - "Lifeline's note for"
            - "Transfers: 1 sent on SG>BR, total 1200 SGD, fees 5.60 SGD."
            - "Exchange cost paid: 0 SGD on SG>BR."
            - "Taxes: no tax figure is on file, because no route or entry carries one."
            - "Routes used: 1 over wise."
            - "Against the bank wire: wise for 1200 SGD cost 49.40 SGD less than the bank wire quoted in the same turn."
            - "Unusual: refused requests 0, payees added 0, rescues started 0, suspected injections 0."
            - ": nothing on file."
  - lang: pt
    turns:
      - user: Enviar 1.200 SGD de aluguel para landlord_sp no Brasil
        model:
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
      - user: Sim, pode enviar
        confirm: latest
      - user: Quero a nota deste mês
        model:
          - calls:
              - name: monthly_summary
          - text: ""
        expect:
          must_contain:
            - "Nota do Lifeline para"
            - "Transferências: 1 enviadas em SG>BR, total de 1200 SGD, taxas de 5.60 SGD."
            - "Custo de câmbio pago: 0 SGD em SG>BR."
            - "Impostos: nenhum valor de imposto está registrado, porque nenhuma rota ou entrada traz um."
            - "Rotas usadas: 1 via wise."
            - "Em comparação com a transferência bancária: não há comparação registrada para wise com 1200 SGD."
            - "Fora do comum: pedidos recusados 0, destinatários adicionados 0, resgates iniciados 0, suspeitas de injeção 0."
            - ": nada registrado."
          must_not_contain:
            - "a menos que"
  - lang: zh
    expected:
      ledger: [proposal, decision, execution, proposal, decision, confirmation, execution, receipt, proposal, decision, execution]
    turns:
      - user: 给 landlord_sp 转 1200 新元房租
        model:
          - calls:
              - name: get_quote
                arguments: {corridor: SG>BR, amount: "1200", currency: SGD, purpose: rent}
          - calls:
              - name: propose_transfer
                arguments: {amount: "1200", currency: SGD, corridor: SG>BR, payee_id: landlord_sp, purpose: rent}
      - user: 好的，发送
        confirm: latest
      - user: 给我这个月的月度记录
        model:
          - calls:
              - name: monthly_summary
          - text: ""
        expect:
          must_contain:
            - "Lifeline 的"
            - "转账：在 SG>BR 上发出 1 笔，共 1200 SGD，手续费 5.60 SGD。"
            - "已付汇率成本：SG>BR 上 0 SGD。"
            - "税费：没有记录任何税费数字，因为没有任何路线或记录包含税费。"
            - "使用的路线：wise 1 笔。"
            - "与银行电汇相比：wise 发送 1200 SGD，比同一轮对话中报价的银行电汇少花 49.40 SGD。"
            - "异常情况：被拒绝的请求 0 次，新增收款人 0 个，启动救援 0 次，疑似注入 0 次。"
            - "即将发生：没有记录。"
