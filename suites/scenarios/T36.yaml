id: T36
live: true
note: Parents in China want to send the semester's costs to Singapore. The scripted model runs the precheck remit_from_china and quotes China to Singapore for paying the institution and for funding the student. Every fact the model is given comes from an entry. The precheck gives the Bank of China checklist from cn_boc_anxin_009, the annual quota from cn_fx_quota_001 and the People's Bank's rule from cn_cdd_004 that the remitter's information is verified from 5,000 yuan, that no sourced duration is on file, and the caveat that the Bank of China page is from 2010 and names only certain branches. The quote for tuition comes back blocked, because NUS asks for Flywire or Convera, with NUS's own sentences from sg_nus_fee_payment_003, including that a family member can pay through Convera, that the payer is identity checked, and the 2 to 3 business days. The quote for funding the student comes back blocked for want of a sourced duration. All three pass the engine at T0. The reply is scripted model text that repeats only those entries and gives no date; what the scenario asserts is what the router gave the model. The NUS entry was opened by SP because the tool was blocked, and the Bank of China, quota and due diligence entries were rewritten and checked by Claude Code on 9 October 2026 after the knowledge audit, the quota entry against SAFE's own page of 5 January 2007, so all wait for a second check.
expected:
  reply: answer
  ledger: [proposal, decision, execution, proposal, decision, execution, proposal, decision, execution]
runs:
  - lang: zh
    turns:
      - user: 我父母在中国，想把我这学期的费用汇到新加坡，银行会要什么材料，什么时候开始办？
        model:
          - calls:
              - name: precheck
                arguments: {action_kind: remit_from_china, provider: cn_bank_remit_sim}
              - name: get_quote
                arguments: {corridor: "CN>SG", amount: "30000", currency: CNY, purpose: tuition}
              - name: get_quote
                arguments: {corridor: "CN>SG", amount: "30000", currency: CNY, purpose: living_costs}
          - text: 给你本人汇生活费：中国银行要求护照、身份证或户口本、录取通知书原件（cn_boc_anxin_009），Lifeline 没有关于所需时间的有来源数据。交学费：家人可以通过 Convera GlobalPay 代付，付款人要通过身份核验，学校可能要求你提供与付款人关系的证明，Convera 付款通常在线下转账完成后 2 至 3 个工作日到达 NUS（sg_nus_fee_payment_003）。中国方面：境内个人年度购汇额度为 5 万美元（cn_fx_quota_001），单笔 5,000 元人民币或 1,000 美元及以上，银行要核实汇款人信息（cn_cdd_004）。中国银行的这个页面是 2010 年的，只列出部分分行，需要向中国银行确认（cn_boc_anxin_009）。
        expect: {reply: answer, lang: zh}
      - user: 这些信息来自哪里？
        model:
          - text: 来自上面列出的条目。
        expect:
          reply: answer
          model_saw: &facts
            - '"documents_likely": ["passport", "ID card or Hukou book", "enrollment or admission letter"]'
            - '"rule_ids": ["cn_boc_anxin_009", "cn_fx_quota_001", "cn_cdd_004"]'
            - "set an annual quota of 50,000 US dollars for foreign exchange purchases by domestic individuals, raised from 20,000 US dollars"
            - "must verify the accuracy of the remitter's information when a single remittance is 5,000 yuan or more, or 1,000 US dollars or more in foreign currency."
            - "Lifeline has no sourced duration on file for this transfer. Source: cn_boc_anxin_009."
            - "The Bank of China page on file for the An Xin account is from 2010 and names only certain branches"
            - "NUS asks for payment through Flywire or Convera, and Lifeline has no sourced rule on file for a direct bank remittance to the institution."
            - "A student, a family member or a third party can make a payment on the student's behalf through Convera GlobalPay"
            - "as part of KYC checks the payer must provide their details and authenticate the payment"
            - "A Convera payment is typically delivered to NUS within 2 to 3 business days after the offline transfer is completed."
            - "Sources: sg_nus_fee_payment_003, cn_edu_remit_002."
            - "Funding the student is a remittance to their own account. Lifeline has no sourced duration on file for this transfer. Source: cn_boc_anxin_009."
  - lang: en
    turns:
      - user: My parents in China want to send my semester's costs to Singapore. What will the bank ask for and when should they start?
        model:
          - calls:
              - name: precheck
                arguments: {action_kind: remit_from_china, provider: cn_bank_remit_sim}
              - name: get_quote
                arguments: {corridor: "CN>SG", amount: "30000", currency: CNY, purpose: tuition}
              - name: get_quote
                arguments: {corridor: "CN>SG", amount: "30000", currency: CNY, purpose: living_costs}
          - text: "Funding you: Bank of China asks for the originals of the passport, the ID card or Hukou book, and the enrollment or admission letter (cn_boc_anxin_009); Lifeline has no sourced duration for it. Paying NUS: a family member can pay through Convera GlobalPay, the payer is identity checked and NUS may ask you for documents about your relationship with them, and a Convera payment is typically delivered within 2 to 3 business days after the offline transfer is completed (sg_nus_fee_payment_003). On the Chinese side: an annual quota of 50,000 US dollars (cn_fx_quota_001) and a check of the remitter's information on a single remittance from 5,000 yuan (cn_cdd_004). The Bank of China page is from 2010 and names only certain branches, so confirm with Bank of China (cn_boc_anxin_009)."
        expect: {reply: answer, lang: en}
      - user: Where does each of those come from?
        model:
          - text: From the entries named beside each one.
        expect:
          reply: answer
          model_saw: *facts
