id: T22
note: Covers answering each turn in the language of that turn. The loop does not carry earlier turns into the next model call, so keeping context across turns is neither built nor tested here.
runs:
  - lang: en
    turns:
      - user: What is my balance?
        lang: en
        model:
          - calls:
              - name: read_balance
                arguments: {}
          - text: You have 2,300 SGD and 150 BRL.
        expect: {reply: answer, lang: en}
      - user: E quanto tenho em reais?
        lang: pt
        model:
          - calls:
              - name: read_balance
                arguments: {currency: BRL}
          - text: Você tem 150 BRL.
        expect: {reply: answer, lang: pt}
      - user: 我有多少新元？
        lang: zh
        model:
          - calls:
              - name: read_balance
                arguments: {currency: SGD}
          - text: 你有 2300 新元。
        expect: {reply: answer, lang: zh}
    expected:
      rule_ids: [R02]
      ledger: [proposal, decision, execution, proposal, decision, execution, proposal, decision, execution]
