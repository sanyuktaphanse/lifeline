id: T22
note: The replies to each language come from the scripted model; the scenario checks that every turn reaches the model with the earlier turns, tool results included, and is answered in its own language.
runs:
  - lang: en
    turns:
      - user: What is my balance?
        lang: en
        model:
          - calls:
              - name: read_balance
                arguments: {}
          - text: You have 2,300 SGD and 150 BRL.
        expect: {reply: answer, lang: en}
      - user: E quanto tenho em reais?
        lang: pt
        model:
          - text: Você tem 150 BRL, como eu disse.
        expect:
          reply: answer
          lang: pt
          model_saw:
            - What is my balance?
            - '"SGD": "2300"'
            - You have 2,300 SGD and 150 BRL.
      - user: 那新元呢？
        lang: zh
        model:
          - text: 你有 2300 新元。
        expect:
          reply: answer
          lang: zh
          model_saw:
            - What is my balance?
            - E quanto tenho em reais?
            - Você tem 150 BRL, como eu disse.
    expected:
      ledger: [proposal, decision, execution]
