name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the documentation test can check that the commit its evidence appendix names is an ancestor.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: make evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-report
          path: evidence/report.md
          if-no-files-found: error

  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # app/tests/e2e/fixtures.js starts the API with .venv/bin/python at the repository root.
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npx playwright test
        working-directory: app
