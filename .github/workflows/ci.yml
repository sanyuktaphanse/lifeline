name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the documentation test can check that the commit its evidence appendix names is an ancestor.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: make evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-report
          path: evidence/report.md
          if-no-files-found: error
